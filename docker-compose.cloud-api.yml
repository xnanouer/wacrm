name: nexora

x-app: &app
  image: nexora-app:${NEXT_PUBLIC_APP_VERSION:-latest}
  env_file:
    - .env.production
  init: true
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '5'

services:
  web:
    <<: *app
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?required}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?required}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?required}
    expose:
      - '3000'
    mem_limit: 2560m
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    stop_grace_period: 30s

  scheduler:
    <<: *app
    command: ['node', 'scripts/production-cron.mjs']
    volumes:
      - ./scripts/production-cron.mjs:/app/scripts/production-cron.mjs:ro
    environment:
      SCHEDULER_BASE_URL: http://web:3000
    depends_on:
      web:
        condition: service_healthy
    mem_limit: 192m
    stop_grace_period: 10s

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?required}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./ops/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'

volumes:
  caddy_data:
  caddy_config:
